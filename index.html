<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Is This? · Friendsgiving</title>
<meta name="description" content="Friendsgiving at James and Lindsey's: secretly describe a friend, then guess who each description is about. Join on your phone.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#24140d">
<meta property="og:type" content="website">
<meta property="og:url" content="https://friendsgiving-game.netlify.app/">
<meta property="og:site_name" content="Who Is This?">
<meta property="og:title" content="Who Is This? · Friendsgiving at James and Lindsey's">
<meta property="og:description" content="Secretly describe a friend, then guess who each description is about. Join on your phone.">
<meta property="og:image" content="https://friendsgiving-game.netlify.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Who Is This? Friendsgiving at James and Lindsey's">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#24140d;--bg2:#3a2014;--card:#43271a;--line:#5e3a26;
  --cream:#fff3e0;--muted:#d9b99b;--pumpkin:#f28c28;--gold:#f6c453;
  --good:#5cc27a;--bad:#ef6a55;
  --c0:#e2523f;--c1:#3b7dd8;--c2:#d99510;--c3:#3a9d55;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,sans-serif;background:var(--bg);
  background-image:radial-gradient(ellipse at top,#53301c 0%,rgba(36,20,13,0) 65%);
  background-attachment:fixed;color:var(--cream);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px 40px;gap:20px;text-align:center}
h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:700;line-height:1;letter-spacing:-.01em}
h1 .alt{color:var(--pumpkin)}
h2{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:600;line-height:1.15}
.sub{color:var(--muted);font-size:clamp(1rem,2vw,1.35rem);line-height:1.35}
.small{font-size:.95rem}
.emoji{font-size:clamp(3rem,8vw,5rem);line-height:1}
.btn{font:inherit;font-weight:600;font-size:1.15rem;border:0;border-radius:14px;padding:14px 26px;
  cursor:pointer;background:var(--pumpkin);color:#2a1408;box-shadow:0 5px 0 #a8561a;
  transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #a8561a}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{font-size:1.45rem;padding:18px 36px}
.btn.swap{font-size:.9rem;padding:6px 12px;border-radius:10px;margin-top:6px;align-self:flex-start}
input,textarea,select{font:inherit;color:var(--cream);background:var(--bg2);border:2px solid var(--line);
  border-radius:12px;padding:12px 14px;width:100%;font-size:1.1rem}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pumpkin)}
label{display:block;text-align:left;font-weight:500;margin-bottom:6px}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.stack{display:flex;flex-direction:column;gap:14px;width:100%;max-width:440px}
.err{color:var(--bad);font-weight:500}
.left{color:var(--gold);font-variant-numeric:tabular-nums}
.topbar{display:flex;justify-content:space-between;gap:12px;padding:14px 18px 0;color:var(--muted);
  font-size:clamp(1rem,1.8vw,1.3rem);font-weight:500}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(280px,1fr) 1.6fr;gap:32px;width:100%;max-width:1200px;align-items:center}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.joinbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.url{font-size:1.15rem;font-weight:500;word-break:break-all}
.code{font-size:clamp(3.2rem,9vw,6.5rem);font-weight:700;letter-spacing:.12em;color:var(--gold);line-height:1}
#qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;line-height:0}
#qr img,#qr canvas{display:block;width:200px;height:200px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:48px}
.chip{font:inherit;color:var(--cream);background:var(--bg2);border:2px solid var(--line);border-radius:999px;
  padding:8px 18px;font-size:1.25rem;font-weight:500;animation:pop .35s ease-out}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--bad)}
.chip.off{opacity:.45}
.chip.done{border-color:var(--good)}
.settings{width:100%;text-align:left}
.settings summary{cursor:pointer;color:var(--muted);font-size:1.05rem;padding:6px 0}
.settings .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.settings .full{grid-column:1/-1}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* guessing */
.prompt-label{color:var(--gold);font-size:clamp(1.1rem,2.4vw,1.9rem);font-weight:500}
.answer{font-size:clamp(1.8rem,4.6vw,3.8rem);font-weight:600;line-height:1.2;max-width:1100px;width:100%;
  overflow-wrap:anywhere;animation:pop .4s ease-out}
.tnum{font-size:clamp(2.6rem,5vw,4rem);font-weight:700;line-height:1}
.timer{width:min(900px,92%);height:16px;background:var(--bg2);border-radius:999px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pumpkin);transition:width .25s linear}

/* phone choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.choice{font:inherit;font-weight:600;font-size:1.2rem;color:#fff;border:0;border-radius:14px;padding:16px 10px;
  min-height:80px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;align-items:center;
  justify-content:center;gap:8px;overflow-wrap:anywhere}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.choice .shape{opacity:.75;font-size:.85em}
.k0{background:var(--c0)}.k1{background:var(--c1)}.k2{background:var(--c2)}.k3{background:var(--c3)}
.quote{font-size:1.25rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.about{text-align:left;color:var(--gold);font-size:1.15rem;margin-bottom:2px}
.about b{font-weight:600}

/* reveal + board */
.reveal-name{font-size:clamp(3rem,9vw,7rem);font-weight:700;color:var(--gold);line-height:1;animation:pop .5s ease-out}
.board{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);
  border-radius:12px;padding:10px 18px;font-size:clamp(1.05rem,2vw,1.45rem);font-weight:500}
.row .pts{color:var(--gold);font-weight:600}
.gain{color:var(--good);font-weight:600}
.verdict{font-size:clamp(2.6rem,10vw,4rem);font-weight:700;line-height:1}
.ok{color:var(--good)}.no{color:var(--bad)}

/* podium */
.podium{display:flex;align-items:flex-end;gap:14px;justify-content:center;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(100px,18vw,220px)}
.pod .nm{font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:600;overflow-wrap:anywhere}
.pod .sc{color:var(--muted)}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:12px;
  font-size:2.6rem;font-weight:700;color:#2a1408;animation:rise .7s ease-out both}
.p1 .blk{height:clamp(140px,22vh,230px);background:var(--gold);animation-delay:.6s}
.p2 .blk{height:clamp(100px,16vh,170px);background:#dcdcdc;animation-delay:.3s}
.p3 .blk{height:clamp(70px,11vh,120px);background:#d08a4f}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}

/* home: event banner, how to play + footer */
.event{color:var(--gold);font-weight:600;font-size:clamp(1.1rem,2.6vw,1.6rem);letter-spacing:.02em;
  border:2px solid var(--line);border-radius:999px;padding:8px 20px}
.howto{width:100%;max-width:560px;text-align:left;background:var(--card);border-radius:16px;padding:6px 18px}
.howto summary{cursor:pointer;font-weight:600;font-size:1.15rem;padding:10px 0;text-align:center}
.howto h3{color:var(--gold);font-size:1.05rem;font-weight:600;margin:14px 0 6px}
.howto ol,.howto ul{padding-left:22px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:4px}
.howto b{color:var(--cream);font-weight:500}
.howto>:last-child{margin-bottom:14px}
.prompts{width:100%;max-width:560px;background:var(--card);border-radius:16px;padding:18px}
.prompts h3{color:var(--gold);font-size:1.25rem;font-weight:600;margin-bottom:4px}
.prompts ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.prompts li{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.98rem;line-height:1.3}
.foot{color:var(--muted);font-size:.95rem;padding:0 16px 20px;text-align:center}
.foot a{color:var(--pumpkin);text-decoration:none;font-weight:500}
.foot a:hover{text-decoration:underline}

.status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;
  padding:8px 18px;border-radius:999px;font-size:1rem;font-weight:500;z-index:10;display:none}
.status.show{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div class="status" id="status"></div>
<script>
(() => {
'use strict';

/* ---------- shared helpers ---------- */
const $app = document.getElementById('app');
const PREFIX = 'whoisthis/v3-k7q2m9x4/';
const SHAPES = ['▲', '◆', '●', '■'];
// prompts about the person you drew. They show on the TV without the name, so keep them about "them"
const DEFAULT_PROMPTS = [
  "One thing I like about them",
  "The first time I met them, we…",
  "The first thing I noticed about them",
  "Their hidden superpower",
  "The emoji that sums them up",
  "Their vibe, in three words",
  "Who would play them in a movie",
  "What they'd be famous for in another life",
  "Their signature move at a party",
  "The topic they could happily talk about for hours",
  "Their go-to karaoke song",
  "If they were a Thanksgiving dish, they'd be…",
  "Their dream job if money didn't matter",
  "Something they're secretly great at",
  "The best advice they'd give",
  "Why the group chat is better with them in it",
  "What they always bring to group hangs",
  "Something they get way too excited about",
  "The most \"them\" thing they'd say",
  "Why I'd want them on my team",
  "Their perfect day off",
  "Their go-to coffee or drink order",
  "The fictional character they're most like",
  "The Olympic event they'd win gold in",
  "Why I'm thankful for them"
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += L[Math.random() * L.length | 0]; return s; }
function ordinal(n) { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function setStatus(msg) { const el = document.getElementById('status'); if (!el) return; el.textContent = msg || ''; el.classList.toggle('show', !!msg); }
const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);

/* ---------- messaging ----------
   Phones and the host talk through free public MQTT brokers over secure websockets, which
   work on cellular and most Wi-Fi. Everything goes through both brokers at once, so the game
   keeps working if either one is down; receivers drop the duplicate copy by message id. */
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
function Net({ subs, will, onMsg, onConnect, onStatus }) {
  const seen = new Set(), dec = new TextDecoder();
  const clients = BROKERS.map(url => {
    const c = mqtt.connect(url, { will, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 8000, clean: true, resubscribe: false, queueQoSZero: false });
    c.on('connect', () => { c.subscribe(subs); onConnect && onConnect(c); onStatus && onStatus(); });
    c.on('close', () => onStatus && onStatus());
    c.on('error', () => {});
    c.on('message', (topic, buf) => {
      let m; try { m = JSON.parse(dec.decode(buf)); } catch (e) { return; }
      if (!m || typeof m !== 'object' || !m._id || seen.has(m._id)) return;
      if (seen.size > 3000) seen.clear();
      seen.add(m._id);
      onMsg(topic, m);
    });
    return c;
  });
  return {
    up: () => clients.some(c => c.connected),
    pub(topic, msg, opts, only) {
      const s = JSON.stringify(Object.assign({ _id: rid() }, msg));
      for (const c of only ? [only] : clients) if (c.connected) c.publish(topic, s, opts || {});
    },
    wake() { for (const c of clients) if (!c.connected && !c.reconnecting) try { c.reconnect(); } catch (e) {} },
    end() { for (const c of clients) try { c.end(true); } catch (e) {} }
  };
}

let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

function title(size) {
  return `<h1${size ? ` style="font-size:${size}"` : ''}>Who Is <span class="alt">This?</span></h1>`;
}

/* ---------- HOST (TV) ---------- */
const Host = {
  active: false, net: null, code: null, ready: false,
  players: new Map(), phase: 'lobby',
  settings: Object.assign({ per: 2, secs: 20 }, store.get('ton-settings') || {}),
  rounds: [], ri: -1, roundStart: 0, dur: 20000, guesses: new Map(), timer: null, last: null,

  start() {
    this.active = true;
    this.code = newCode();
    keepAwake();
    window.addEventListener('beforeunload', e => { if (this.players.size) { e.preventDefault(); e.returnValue = ''; } });
    this.connect();
  },

  // the room code is claimed with a retained message on <room>/room, which the broker clears if this tab goes away
  connect() {
    this.ready = false;
    this.render();
    clearTimeout(this.claimTimer); clearTimeout(this.downTimer); clearInterval(this.sweeper);
    this.claimTimer = null;
    const base = PREFIX + this.code, me = this.session = rid();
    const claim = c => this.net.pub(base + '/room', { t: 'room', host: me, at: Date.now() }, { retain: true }, c);
    this.conns = new Map(); this.seq = 0; this.dirty = new Set(); this.removed = new Set();
    this.net = Net({
      subs: [base + '/room', base + '/h'],
      will: { topic: base + '/room', payload: '', retain: true, qos: 0 },
      onConnect: c => {
        if (this.ready) claim(c);
        else if (!this.claimTimer) this.claimTimer = setTimeout(() => {
          if (this.session !== me) return;
          claim(); this.ready = true; setStatus(null); this.render(true);
        }, 1500);
      },
      onStatus: () => {
        clearTimeout(this.downTimer);
        if (this.net && this.net.up()) { if (this.ready) setStatus(null); }
        else this.downTimer = setTimeout(() => setStatus('Reconnecting to game server…'), 3000);
      },
      onMsg: (topic, m) => {
        if (this.session !== me) return;
        if (topic === base + '/room') {
          // someone else already has this code: pick another
          if (!this.ready && m.t === 'room' && m.host !== me && Date.now() - m.at < 12 * 3600e3) {
            this.session = null; this.claimTimer = null; this.net.end(); this.code = newCode(); this.connect();
          }
        } else if (typeof m.from === 'string') this.onNet(m);
      }
    });
    this.sweeper = setInterval(() => { this.sweep(); this.beat(); }, 3000);
  },

  // one conn per phone, kept alive by its pings. A conn that went quiet only comes back through a join.
  onNet(m) {
    let conn = this.conns.get(m.from);
    if (!conn) {
      const topic = PREFIX + this.code + '/p/' + m.from;
      conn = { id: m.from, open: true, seen: 0, sent: 0,
        send: msg => this.net.pub(topic, Object.assign({ _h: this.session, _s: ++this.seq }, msg)),
        close() { this.open = false; } };
      this.conns.set(m.from, conn);
    }
    conn.seen = Date.now();
    if (this.removed.has(conn.id)) { if (m.t === 'join') conn.send({ t: 'kicked' }); return; }
    if (m.t === 'ping') return;
    if (!conn.open) { if (m.t !== 'join') return; conn.open = true; }
    if (m.t === 'sync') { const p = this.players.get(conn._pid); if (p && p.conn === conn) this.sendView(p); return; }
    this.onMsg(conn, m);
  },

  sweep() {
    const now = Date.now();
    for (const conn of this.conns.values()) if (conn.open && now - conn.seen > 12000) { conn.open = false; this.onClose(conn); }
  },

  // tells each phone which update it should be on; a phone that's missing one asks for it, one not listed rejoins
  beat() {
    if (!this.ready) return;
    const s = {};
    for (const p of this.players.values()) if (this.online(p)) s[p.conn.id] = p.conn.sent;
    this.net.pub(PREFIX + this.code + '/all', { t: 'beat', h: this.session, s });
  },

  list() { return [...this.players.values()]; },
  online(p) { return !!(p.conn && p.conn.open); },
  ranked() { return this.list().sort((a, b) => b.score - a.score); },
  rankOf(p) { const r = this.ranked(); return r.findIndex(x => x.score === p.score) + 1; },
  winners() { const r = this.ranked(); return r.filter(p => p.score === r[0].score); },

  onClose(conn) {
    const p = this.players.get(conn._pid);
    if (p && p.conn === conn) {
      p.conn = null;
      this.render();
      if (this.phase === 'guess') { this.updateGuessCount(); this.checkAllGuessed(); }
      if (this.phase === 'write' && this.everyoneWrote()) this.autoBegin();
    }
  },

  send(p, msg) { try { if (this.online(p)) p.conn.send(msg); } catch (e) {} },
  sendAll() { for (const p of this.players.values()) this.sendView(p); },

  // the public brokers drop messages from anyone sending more than ~10 at once, so phone updates
  // are batched into one message for the whole room
  sendView(p) {
    this.dirty.add(p.id);
    if (!this.flushTimer) this.flushTimer = setTimeout(() => this.flush(), 120);
  },

  flush() {
    this.flushTimer = null;
    const v = {}, s = ++this.seq;
    for (const id of this.dirty) {
      const p = this.players.get(id);
      if (p && this.online(p)) { v[p.conn.id] = this.viewFor(p); p.conn.sent = s; }
    }
    this.dirty.clear();
    if (Object.keys(v).length) this.net.pub(PREFIX + this.code + '/all', { t: 'views', v, _h: this.session, _s: s });
  },

  onMsg(conn, msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'join') {
      const name = String(msg.name || '').replace(/\s+/g, ' ').trim().slice(0, 16);
      if (!name) return;
      let p = this.list().find(x => x.name.toLowerCase() === name.toLowerCase());
      if (p && this.online(p) && p.conn !== conn) {
        try { conn.send({ t: 'err', msg: "That name is already taken. Pick another, or if it's you on a new phone, wait 15 seconds and try again." }); } catch (e) {}
        return;
      }
      if (!p) {
        p = { id: Math.random().toString(36).slice(2, 10), name, score: 0, conn, tasks: [], answers: null };
        this.players.set(p.id, p);
        if (this.phase === 'write') this.assignLate(p);
      } else {
        p.conn = conn;
      }
      conn._pid = p.id;
      this.render();
      if (this.phase === 'lobby') this.sendAll(); else this.sendView(p);
      if (this.phase === 'guess') this.updateGuessCount();
      return;
    }
    const p = this.players.get(conn._pid);
    if (!p || p.conn !== conn) return;

    if (msg.t === 'answers' && this.phase === 'write' && !p.answers) {
      const arr = Array.isArray(msg.answers) ? msg.answers : [];
      p.answers = p.tasks.map((_, i) => String(arr[i] || '').trim().slice(0, 140));
      this.render();
      this.sendView(p);
      if (this.everyoneWrote()) this.autoBegin();
    }

    if (msg.t === 'swap' && this.phase === 'write' && !p.answers) {
      const i = msg.i | 0;
      if (i < 0 || i >= p.tasks.length) return;
      const held = p.tasks.map(t => t.prompt);
      const open = DEFAULT_PROMPTS.filter(x => !held.includes(x));
      if (!open.length) return;
      if (!p.seen) p.seen = new Set(held);
      // prefer prompts this player hasn't seen and nobody else is using; once they've cycled through all, start over
      const used = this.usedPrompts(p);
      let fresh = open.filter(x => !p.seen.has(x) && !used.has(x));
      if (!fresh.length) fresh = open.filter(x => !p.seen.has(x));
      if (!fresh.length) { p.seen = new Set(held); fresh = open; }
      p.tasks[i].prompt = shuffle(fresh)[0];
      p.seen.add(p.tasks[i].prompt);
      this.sendView(p);
    }

    // anyone except the writer can guess, including the person being described
    if (msg.t === 'guess' && this.phase === 'guess') {
      const r = this.rounds[this.ri];
      if (!r || p.id === r.author || this.guesses.has(p.id)) return;
      if (!this.players.has(msg.target)) return;
      this.guesses.set(p.id, { target: msg.target, ms: Date.now() - this.roundStart });
      this.sendView(p);
      this.updateGuessCount();
      this.checkAllGuessed();
    }
  },

  kick(id) {
    const p = this.players.get(id);
    if (!p || !confirm(`Remove ${p.name} from the game?`)) return;
    this.send(p, { t: 'kicked' });
    if (p.conn) this.removed.add(p.conn.id);
    this.players.delete(id);
    setTimeout(() => { try { p.conn && p.conn.close(); } catch (e) {} }, 300);
    this.render();
    this.sendAll();
  },

  /* ---- phases ---- */
  readSettings() {
    const per = document.getElementById('set-per'), secs = document.getElementById('set-secs');
    if (per) this.settings.per = +per.value;
    if (secs) this.settings.secs = +secs.value;
    store.set('ton-settings', this.settings);
    const est = document.getElementById('est'); if (est) est.textContent = this.estimate();
  },

  // the longest the game can run for the players in the lobby (3 minimum): writing time, then every
  // round running its full guess timer plus the reveal, rounded up to the minute
  estimate() {
    const n = Math.max(this.players.size, 3), { secs } = this.settings, per = Math.min(this.settings.per, n - 1);
    const rounds = n * per;
    const mins = Math.ceil((30 + per * 45 + rounds * (secs + 15) + 30) / 60);
    const lead = this.players.size < 3 ? 'With 3 players (the minimum)' : `With ${n} players`;
    return `⏱️ ${lead}, the longest game will be about ${mins} min (${rounds} rounds)`;
  },

  // longest the rest of the game can take, using the same timings as the lobby estimate: what's left of
  // writing, the current round's timer and reveal, then every remaining round run to its full timer
  timeLeft() {
    const R = this.settings.secs + 15, now = Date.now();
    if (this.phase === 'write') {
      const per = Math.max(1, ...this.list().map(p => p.tasks.length));
      const rounds = this.list().reduce((n, p) => n + p.tasks.length, 0);
      return Math.max(0, 30 + per * 45 - (now - this.phaseStart) / 1000) + rounds * R + 30;
    }
    const after = Math.max(0, this.rounds.length - this.ri - 1) * R + 30;
    if (this.phase === 'guess') return Math.max(0, this.dur - (now - this.roundStart)) / 1000 + 15 + after;
    if (this.phase === 'reveal') return Math.max(0, 15 - (now - this.phaseStart) / 1000) + after;
    return 0;
  },

  leftText() {
    const t = Math.ceil(this.timeLeft());
    return `⏱️ ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')} left`;
  },

  leftHtml() { return `<span class="left" id="left" title="Longest the rest of the game can take">${this.leftText()}</span>`; },

  startClock() {
    clearInterval(this.clock);
    this.clock = setInterval(() => { const el = document.getElementById('left'); if (el) el.textContent = this.leftText(); }, 1000);
  },

  // in a shuffled circle, everyone describes the next `per` people after them, so nobody draws
  // themselves, nobody draws the same person twice, and everyone gets described the same number of times
  assignAll() {
    const ps = shuffle(this.list()), n = ps.length, per = Math.min(this.settings.per, n - 1);
    for (const p of ps) { p.tasks = []; p.answers = null; }
    for (let k = 1; k <= per; k++) ps.forEach((p, i) => p.tasks.push({ subject: ps[(i + k) % n].id }));
    for (const p of ps) this.dealPrompts(p);
  },

  // someone who joins mid-writing describes random others
  assignLate(p) {
    const others = shuffle(this.list().filter(x => x.id !== p.id)).slice(0, this.settings.per);
    p.tasks = others.map(x => ({ subject: x.id }));
    p.answers = null;
    this.dealPrompts(p);
  },

  // prompts other players are using right now, so the same prompt doesn't come up twice in a game
  usedPrompts(p) {
    const used = new Set();
    for (const q of this.players.values()) if (q !== p) for (const t of q.tasks || []) if (t.prompt) used.add(t.prompt);
    return used;
  },

  dealPrompts(p) {
    const used = this.usedPrompts(p);
    const deck = shuffle(DEFAULT_PROMPTS).sort((a, b) => used.has(a) - used.has(b));
    p.tasks.forEach((t, i) => { t.prompt = deck[i % deck.length]; t.name = this.players.get(t.subject).name; });
    p.seen = new Set(p.tasks.map(t => t.prompt));
  },

  startWriting() {
    if (this.players.size < 3) return;
    this.readSettings();
    this.phase = 'write';
    this.phaseStart = Date.now();
    this.startClock();
    this.assignAll();
    this.render(true);
    this.sendAll();
  },

  everyoneWrote() {
    const on = this.list().filter(p => this.online(p));
    return on.length >= 2 && on.every(p => p.answers);
  },

  autoBegin() {
    clearTimeout(this._auto);
    this._auto = setTimeout(() => { if (this.phase === 'write' && this.everyoneWrote()) this.beginRounds(); }, 1500);
  },

  beginRounds() {
    if (this.phase !== 'write') return;
    let rounds = [];
    for (const p of this.players.values()) {
      (p.answers || []).forEach((a, i) => {
        const t = p.tasks[i];
        // skip descriptions of anyone who was removed, since nobody could pick them
        if (a && t && this.players.has(t.subject)) rounds.push({ author: p.id, subject: t.subject, subjectName: t.name, prompt: t.prompt, answer: a });
      });
    }
    if (!rounds.length) return;
    // avoid the same writer or the same person described twice in a row: build the order greedily
    // from a few hundred random starts and keep the one with the fewest repeats
    const clash = (a, b) => !!a && !!b && (a.author === b.author || a.subject === b.subject);
    let best = null, bestN = Infinity;
    for (let t = 0; t < 200 && bestN; t++) {
      const left = shuffle(rounds), out = [];
      let n = 0;
      while (left.length) {
        let k = left.findIndex(r => !clash(r, out[out.length - 1]));
        if (k < 0) { k = 0; n++; }
        out.push(left.splice(k, 1)[0]);
      }
      if (n < bestN) { best = out; bestN = n; }
    }
    this.rounds = best;
    this.ri = -1;
    this.nextRound();
  },

  nextRound() {
    clearInterval(this.timer);
    this.ri++;
    if (this.ri >= this.rounds.length) return this.finish();
    this.phase = 'guess';
    this.guesses = new Map();
    this.dur = this.settings.secs * 1000;
    this.roundStart = Date.now();
    this.render(true);
    this.sendAll();
    this.timer = setInterval(() => this.tick(), 250);
  },

  eligible() {
    const r = this.rounds[this.ri];
    return this.list().filter(p => this.online(p) && p.id !== r.author);
  },

  tick() {
    const left = Math.max(0, this.dur - (Date.now() - this.roundStart));
    const t = document.getElementById('tnum'); if (t) t.textContent = Math.ceil(left / 1000);
    const b = document.getElementById('tbar'); if (b) b.style.width = (left / this.dur * 100) + '%';
    if (left <= 0) this.reveal();
  },

  updateGuessCount() {
    const el = document.getElementById('gc');
    if (el && this.phase === 'guess') {
      const elig = this.eligible();
      el.textContent = `${elig.filter(p => this.guesses.has(p.id)).length} / ${elig.length} guessed`;
    }
  },

  checkAllGuessed() {
    if (this.phase !== 'guess') return;
    const elig = this.eligible();
    if (elig.length && elig.every(p => this.guesses.has(p.id))) setTimeout(() => { if (this.phase === 'guess') this.reveal(); }, 600);
  },

  reveal() {
    if (this.phase !== 'guess') return;
    clearInterval(this.timer);
    const r = this.rounds[this.ri];
    const gains = new Map();
    const right = [];
    for (const [pid, g] of this.guesses) {
      const p = this.players.get(pid); if (!p) continue;
      if (g.target === r.subject) {
        const pts = Math.round(500 + 500 * Math.max(0, 1 - g.ms / this.dur));
        p.score += pts; gains.set(pid, pts); right.push({ name: p.name, pts });
      } else gains.set(pid, 0);
    }
    // the writer scores for every right guess, so specific descriptions pay off
    const author = this.players.get(r.author);
    const authorPts = right.length * 150;
    if (author) { author.score += authorPts; gains.set(author.id, authorPts); }
    right.sort((a, b) => b.pts - a.pts);
    const subject = this.players.get(r.subject);
    this.last = { gains, authorPts, right, authorName: author ? author.name : 'Someone who left',
      subjectName: subject ? subject.name : r.subjectName };
    this.phase = 'reveal';
    this.phaseStart = Date.now();
    this.render(true);
    this.sendAll();
  },

  finish() {
    clearInterval(this.timer);
    this.phase = 'final';
    clearInterval(this.clock);
    this.render(true);
    this.sendAll();
  },

  playAgain() {
    for (const p of this.players.values()) { p.score = 0; p.answers = null; p.tasks = []; }
    this.rounds = []; this.ri = -1; this.last = null;
    this.phase = 'lobby';
    clearInterval(this.clock);
    this.render(true);
    this.sendAll();
  },

  primary() {
    if (this.phase === 'lobby') this.startWriting();
    else if (this.phase === 'write') this.beginRounds();
    else if (this.phase === 'guess') this.reveal();
    else if (this.phase === 'reveal') this.nextRound();
  },

  /* ---- what each phone sees ---- */
  viewFor(p) {
    const base = { name: p.name, score: p.score };
    let v;
    if (this.phase === 'lobby') v = { phase: 'lobby', count: this.players.size };
    else if (this.phase === 'write') v = { phase: 'write', tasks: p.tasks.map(t => ({ name: t.name, prompt: t.prompt })),
      done: !!p.answers, canSwap: DEFAULT_PROMPTS.length > p.tasks.length };
    else if (this.phase === 'guess') {
      const r = this.rounds[this.ri];
      const g = this.guesses.get(p.id);
      // everyone is an option (the writer too), so the list never gives away who wrote it
      v = { phase: 'guess', n: this.ri + 1, total: this.rounds.length, prompt: r.prompt, answer: r.answer,
            isAuthor: r.author === p.id, picked: g ? g.target : null,
            options: this.list().map(x => ({ id: x.id, name: x.name, me: x.id === p.id })) };
      if (g) { const t = this.players.get(g.target); v.pickedName = t ? (t.id === p.id ? 'Me!' : t.name) : '?'; }
    } else if (this.phase === 'reveal') {
      const r = this.rounds[this.ri];
      const g = this.guesses.get(p.id);
      v = { phase: 'reveal', isAuthor: r.author === p.id, isSubject: r.subject === p.id,
            authorName: this.last.authorName, subjectName: this.last.subjectName, knew: this.last.right.length,
            gain: this.last.gains.get(p.id) || 0, correct: g ? g.target === r.subject : null, rank: this.rankOf(p) };
    } else if (this.phase === 'final') v = { phase: 'final', rank: this.rankOf(p), total: this.players.size, tied: this.winners().length > 1 };
    return Object.assign(base, v);
  },

  /* ---- TV rendering ---- */
  render(full) {
    if (!this.active) return;
    if (!this.ready && this.phase === 'lobby') {
      $app.innerHTML = `<div class="screen">${title()}<p class="sub">Setting up the game room…</p></div>`;
      return;
    }
    const fn = { lobby: this.vLobby, write: this.vWrite, guess: this.vGuess, reveal: this.vReveal, final: this.vFinal }[this.phase];
    fn.call(this, full);
  },

  chips(kind) {
    return this.list().map(p => {
      const cls = ['chip', this.online(p) ? '' : 'off', kind === 'write' && p.answers ? 'done' : ''].join(' ');
      if (kind === 'lobby') return `<button class="${cls}" data-kick="${p.id}" title="Click to remove">${esc(p.name)}</button>`;
      return `<span class="${cls}">${kind === 'write' && p.answers ? '✓ ' : ''}${esc(p.name)}</span>`;
    }).join('') || `<span class="sub">Waiting for players…</span>`;
  },

  vLobby(full) {
    const n = this.players.size;
    const countText = n < 3 ? `${n} joined — need at least 3` : `${n} players ready`;
    if (!full && document.getElementById('lobby-root')) {
      document.getElementById('chips').innerHTML = this.chips('lobby');
      document.getElementById('count').textContent = countText;
      document.getElementById('go').disabled = n < 3;
      document.getElementById('est').textContent = this.estimate();
      return;
    }
    const url = location.origin + location.pathname + '?room=' + this.code;
    const s = this.settings;
    $app.innerHTML = `<div class="screen" id="lobby-root"><div class="lobby">
      <div class="card joinbox">
        <div class="sub">Scan to join</div>
        <div id="qr"></div>
        <div class="url">${esc(url.replace(/^https?:\/\//, ''))}</div>
        <div class="sub">Room code</div>
        <div class="code">${this.code}</div>
      </div>
      <div class="stack" style="max-width:none;align-items:center">
        ${title('clamp(2.2rem,4.5vw,3.8rem)')}
        <p class="sub">Your phone secretly gives you a friend to describe. Then guess who each description is about.<br>Fast right guesses score big. So do descriptions everyone gets.</p>
        <div class="sub" id="count">${countText}</div>
        <div class="chips" id="chips">${this.chips('lobby')}</div>
        <div class="sub small" id="est">${this.estimate()}</div>
        <details class="settings">
          <summary>Game settings</summary>
          <p class="sub small" style="margin-top:6px">Game length changes with these and the number of players. The estimate above updates as you go.</p>
          <div class="grid">
            <div><label for="set-per">People each player describes</label>
              <select id="set-per">${[1,2,3].map(v => `<option ${v === s.per ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
            <div><label for="set-secs">Seconds to guess</label>
              <select id="set-secs">${[15,20,30].map(v => `<option ${v === s.secs ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          </div>
        </details>
        <button class="btn big" id="go" ${n < 3 ? 'disabled' : ''}>Start game</button>
      </div></div></div>`;
    try { if (window.QRCode) new QRCode(document.getElementById('qr'), { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
    document.getElementById('go').onclick = () => this.startWriting();
    document.getElementById('chips').onclick = e => { const b = e.target.closest('[data-kick]'); if (b) this.kick(b.dataset.kick); };
    ['set-per', 'set-secs'].forEach(id => ['change', 'input'].forEach(ev => document.getElementById(id).addEventListener(ev, () => this.readSettings())));
  },

  vWrite() {
    const done = this.list().filter(p => p.answers).length;
    $app.innerHTML = `<div class="topbar"><span>Room ${this.code}</span>${this.leftHtml()}<span>${done} / ${this.players.size} done</span></div>
      <div class="screen">
        <div class="emoji">✍️</div>
        <h2>Describe your secret people<br>on your phone</h2>
        <p class="sub">No names! Make it specific enough that everyone can guess who it is.</p>
        <div class="chips">${this.chips('write')}</div>
        <button class="btn ghost" id="go" ${done ? '' : 'disabled'}>Start guessing now</button>
      </div>`;
    document.getElementById('go').onclick = () => this.beginRounds();
  },

  vGuess(full) {
    if (!full && document.getElementById('guess-root')) { this.updateGuessCount(); return; }
    const r = this.rounds[this.ri];
    $app.innerHTML = `<div class="topbar"><span>Round ${this.ri + 1} of ${this.rounds.length}</span>${this.leftHtml()}<span id="gc"></span></div>
      <div class="screen" id="guess-root">
        <div class="prompt-label">${esc(r.prompt)}</div>
        <div class="card answer">“${esc(r.answer)}”</div>
        <h2 style="font-size:clamp(1.3rem,2.6vw,2rem)">Who is this?</h2>
        <div class="tnum" id="tnum">${this.settings.secs}</div>
        <div class="timer"><i id="tbar" style="width:100%"></i></div>
        <button class="btn ghost" id="skip">Reveal now</button>
      </div>`;
    this.updateGuessCount();
    document.getElementById('skip').onclick = () => this.reveal();
  },

  vReveal() {
    const r = this.rounds[this.ri], L = this.last;
    const lastRound = this.ri >= this.rounds.length - 1;
    const rightText = L.right.length
      ? `Got it: ${L.right.map(x => `${esc(x.name)} <span class="gain">+${fmt(x.pts)}</span>`).join(', ')}`
      : 'Nobody got it!';
    const byText = `Written by ${esc(L.authorName)}${L.authorPts ? ` <span class="gain">+${fmt(L.authorPts)}</span>` : ''}`;
    const top = this.ranked().slice(0, 5).map((p, i) =>
      `<div class="row"><span>${i + 1}. ${esc(p.name)}</span><span class="pts">${fmt(p.score)}</span></div>`).join('');
    $app.innerHTML = `<div class="topbar"><span>Round ${this.ri + 1} of ${this.rounds.length}</span>${this.leftHtml()}<span>Room ${this.code}</span></div>
      <div class="screen">
        <div class="prompt-label">“${esc(r.answer)}”</div>
        <div class="sub">is…</div>
        <div class="reveal-name">${esc(L.subjectName)}</div>
        <div class="sub">${byText}</div>
        <div class="sub">${rightText}</div>
        <div class="board">${top}</div>
        <button class="btn big" id="next">${lastRound ? 'Final results 🏆' : 'Next round →'}</button>
        <div class="sub small">or press Space</div>
      </div>`;
    document.getElementById('next').onclick = () => this.nextRound();
  },

  finalHeadline() {
    if (!this.players.size) return 'Game over';
    const w = this.winners().map(p => esc(p.name));
    if (w.length === 1) return w[0] + ' wins the Friendsgiving Game!';
    if (w.length === this.players.size) return "It's a tie! Everyone wins the Friendsgiving Game!";
    return `It's a tie! ${w.slice(0, -1).join(', ')} and ${w[w.length - 1]} share the win!`;
  },

  vFinal() {
    const r = this.ranked();
    const pod = (p, place) => p ? `<div class="pod p${place}"><div class="nm">${esc(p.name)}</div><div class="sc">${fmt(p.score)} pts</div><div class="blk">${place}</div></div>` : '';
    const rest = r.slice(3).map((p, i) => `<div class="row"><span>${i + 4}. ${esc(p.name)}</span><span class="pts">${fmt(p.score)}</span></div>`).join('');
    $app.innerHTML = `<div class="screen">
        <div class="emoji">🏆</div>
        <h2>${this.finalHeadline()}</h2>
        <div class="podium">${pod(r[1], 2)}${pod(r[0], 1)}${pod(r[2], 3)}</div>
        ${rest ? `<div class="board">${rest}</div>` : ''}
        <button class="btn big" id="again">Play again</button>
      </div>`;
    document.getElementById('again').onclick = () => this.playAgain();
  }
};

/* ---------- PLAYER (phone) ---------- */
const Player = {
  net: null, conn: null, code: '', name: '', view: null, stopped: false, kicked: false,
  id: null, heard: 0, upAt: 0, found: false, hostH: null, hostS: 0, pinger: null, dialTimer: null, drafts: [],

  start(code) {
    // a stable id lets a refreshed phone pick up where it left off
    this.id = store.get('ton-pid') || rid();
    store.set('ton-pid', this.id);
    const saved = store.get('ton-player') || {};
    this.form(code || saved.code || '', saved.name || '');
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && this.net && !this.stopped) { this.net.wake(); this.ping(); }
    });
  },

  form(code, name, err) {
    this.view = null;
    $app.innerHTML = `<div class="screen">
      <div class="emoji">🦃</div>
      ${title('2.4rem')}
      <form class="stack" id="jf" autocomplete="off">
        <input id="code" placeholder="Room code" maxlength="4" autocapitalize="characters" value="${esc(code)}"
          style="text-transform:uppercase;text-align:center;letter-spacing:.25em;font-size:1.7rem;font-weight:600">
        <input id="name" placeholder="Your name" maxlength="16" value="${esc(name)}" style="text-align:center;font-size:1.3rem">
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
        <button class="btn big" type="submit">Join</button>
      </form></div>`;
    const c = document.getElementById('code'), n = document.getElementById('name');
    (c.value ? n : c).focus();
    document.getElementById('jf').onsubmit = e => { e.preventDefault(); this.join(c.value, n.value); };
  },

  message(emoji, head, sub) {
    $app.innerHTML = `<div class="screen"><div class="emoji">${emoji}</div><h2>${head}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div>`;
  },

  join(code, name) {
    this.code = String(code).toUpperCase().replace(/[^A-Z]/g, '');
    this.name = String(name).replace(/\s+/g, ' ').trim().slice(0, 16);
    if (this.code.length !== 4 || !this.name) return this.form(this.code, this.name, 'Enter the 4-letter room code and your name.');
    store.set('ton-player', { code: this.code, name: this.name });
    this.stop();
    this.stopped = false; this.kicked = false;
    this.message('⏳', 'Joining…');
    keepAwake();
    this.open();
  },

  // the game counts as reachable while the host has answered in the last 12 seconds
  open() {
    const base = PREFIX + this.code, t0 = Date.now();
    this.heard = 0; this.upAt = 0; this.found = false;
    this.conn = { get open() { return !!(Player.net && Player.net.up() && Date.now() - Player.heard < 12000); }, send: m => this.toHost(m) };
    this.net = Net({
      subs: [base + '/room', base + '/all', base + '/p/' + this.id],
      onConnect: () => { if (!this.upAt) this.upAt = Date.now(); this.toHost({ t: 'join', name: this.name }); },
      onMsg: (topic, m) => { if (topic === base + '/room') this.found = this.found || m.t === 'room'; else this.onHost(m); }
    });
    this.pinger = setInterval(() => this.ping(), 4000);
    this.dialTimer = setInterval(() => {
      if (this.view) return clearInterval(this.dialTimer);
      const now = Date.now();
      let err;
      if (!this.upAt) { if (now - t0 > 10000) err = "Couldn't connect. Check your internet and try again."; }
      else if (!this.found) { if (now - this.upAt > 4000) err = 'No game found with that code.'; }
      else if (now - t0 > 15000) err = "Couldn't reach the game. Try again, or switch between Wi-Fi and cellular.";
      if (err) { this.stop(); this.form(this.code, this.name, err); }
    }, 500);
  },

  toHost(m) { if (this.net) this.net.pub(PREFIX + this.code + '/h', Object.assign({ from: this.id }, m)); },

  ping() {
    if (!this.net || this.stopped) return;
    this.toHost({ t: 'ping' });
    if (this.view && Date.now() - this.heard > 12000) { setStatus('Reconnecting…'); this.net.wake(); }
  },

  onHost(m) {
    this.heard = Date.now(); this.found = true;
    if (this.view) setStatus(null);
    if (m.t === 'beat') {
      const s = m.s || {};
      if (!(this.id in s)) this.toHost({ t: 'join', name: this.name });
      else if (m.h !== this.hostH || s[this.id] > this.hostS) this.toHost({ t: 'sync' });
      return;
    }
    // the same update can arrive through either broker, so skip anything older than what's on screen
    if (m._h === this.hostH && m._s <= this.hostS) return;
    const v = m.t === 'views' ? m.v && m.v[this.id] : m;
    if (!v) return;
    this.hostH = m._h; this.hostS = m._s;
    this.onData(v);
  },

  stop() {
    this.stopped = true;
    clearInterval(this.pinger); clearInterval(this.dialTimer);
    try { this.net && this.net.end(); } catch (e) {}
    this.net = null; this.conn = null;
  },

  onData(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'err') { this.stop(); this.form(this.code, '', m.msg); return; }
    if (m.t === 'kicked') { this.kicked = true; this.stop(); this.message('👋', 'You were removed from the game'); return; }
    if (!m.phase) return;
    const prev = this.view;
    this.view = m;
    // don't wipe what someone is typing, or redraw an identical screen
    if (prev && prev.phase === m.phase) {
      if (m.phase === 'write' && !prev.done && !m.done && JSON.stringify(prev.tasks) === JSON.stringify(m.tasks)) return;
      if (m.phase === 'guess' && prev.n === m.n && prev.picked === m.picked && prev.isAuthor === m.isAuthor) return;
    }
    if (!prev || prev.phase !== 'write') this.drafts = [];
    this.render();
  },

  bar() {
    const v = this.view;
    return `<div class="topbar"><span>${esc(v.name)}</span><span>${fmt(v.score)} pts</span></div>`;
  },

  render() {
    const v = this.view;
    if (v.phase === 'lobby') {
      $app.innerHTML = this.bar() + `<div class="screen"><div class="emoji">🦃</div><h2>You're in, ${esc(v.name)}!</h2>
        <p class="sub">Look at the TV. The game starts soon.</p><p class="sub small">${v.count} player${v.count === 1 ? '' : 's'} joined</p></div>`;
    }
    else if (v.phase === 'write') {
      if (v.done) {
        $app.innerHTML = this.bar() + `<div class="screen"><div class="emoji">✅</div><h2>Locked in</h2><p class="sub">Waiting for everyone else…</p></div>`;
        return;
      }
      $app.innerHTML = this.bar() + `<div class="screen"><form class="stack" id="wf">
        <h2 style="font-size:1.6rem">Your secret people</h2>
        <p class="sub small">Describe each person without using their name. Make it specific so everyone can guess, and keep it kind.${v.canSwap ? ' Don\'t like a prompt? Swap it as many times as you want.' : ''}</p>
        ${v.tasks.map((t, i) => `<div class="stack" style="gap:0"><div class="about">About <b>${esc(t.name)}</b></div>
          <label for="a${i}">${esc(t.prompt)}</label>
          <textarea id="a${i}" maxlength="140" rows="3">${esc(this.drafts[i] || '')}</textarea>
          ${v.canSwap ? `<button class="btn ghost swap" type="button" data-i="${i}">🔀 Swap this prompt</button>` : ''}</div>`).join('')}
        <div class="err" id="werr"></div>
        <button class="btn big" type="submit">Lock in answers</button></form></div>`;
      const f = document.getElementById('wf');
      f.addEventListener('input', () => { this.drafts = v.tasks.map((_, i) => document.getElementById('a' + i).value); });
      f.querySelectorAll('.swap').forEach(b => b.onclick = () => {
        if (!(this.conn && this.conn.open)) { document.getElementById('werr').textContent = 'Reconnecting… try again in a moment.'; return; }
        const i = +b.dataset.i;
        this.drafts = v.tasks.map((_, j) => j === i ? '' : document.getElementById('a' + j).value);
        f.querySelectorAll('.swap').forEach(x => x.disabled = true);
        this.conn.send({ t: 'swap', i });
      });
      f.onsubmit = e => {
        e.preventDefault();
        const answers = v.tasks.map((_, i) => document.getElementById('a' + i).value.trim());
        if (answers.some(a => !a)) { document.getElementById('werr').textContent = 'Fill in every answer first.'; return; }
        const named = v.tasks.find((t, i) => t.name.length > 1 && new RegExp('(^|[^a-z])' + t.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z])').test(answers[i].toLowerCase()));
        if (named) { document.getElementById('werr').textContent = `Don't use ${named.name}'s name. That gives it away!`; return; }
        if (!(this.conn && this.conn.open)) { document.getElementById('werr').textContent = 'Reconnecting… try again in a moment.'; return; }
        this.conn.send({ t: 'answers', answers });
        f.querySelector('button').disabled = true;
      };
    }
    else if (v.phase === 'guess') {
      if (v.isAuthor) {
        $app.innerHTML = this.bar() + `<div class="screen"><div class="emoji">🤫</div><h2>You wrote this one!</h2>
          <p class="sub">Keep a straight face. You score for everyone who guesses right.</p></div>`;
      } else if (v.picked) {
        $app.innerHTML = this.bar() + `<div class="screen"><div class="emoji">🔒</div><h2>Locked in: ${esc(v.pickedName)}</h2>
          <p class="sub">Waiting for the reveal…</p></div>`;
      } else {
        $app.innerHTML = this.bar() + `<div class="screen" style="justify-content:flex-start;gap:16px">
          <div class="sub small">Round ${v.n} of ${v.total}</div>
          <div class="about" style="text-align:center;margin:0">${esc(v.prompt)}</div>
          <div class="card quote">“${esc(v.answer)}”</div>
          <h2 style="font-size:1.5rem">Who is this?</h2>
          <div class="choices">${v.options.map((o, i) =>
            `<button class="choice k${i % 4}" data-id="${o.id}"><span class="shape">${SHAPES[i % 4]}</span>${o.me ? 'Me!' : esc(o.name)}</button>`).join('')}</div></div>`;
        $app.querySelector('.choices').onclick = e => {
          const b = e.target.closest('[data-id]');
          if (!b || !(this.conn && this.conn.open)) return;
          this.conn.send({ t: 'guess', target: b.dataset.id });
          $app.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x !== b) x.style.opacity = .35; });
        };
      }
    }
    else if (v.phase === 'reveal') {
      let html;
      if (v.isAuthor) html = v.knew
        ? `<div class="verdict ok">🎯</div><h2>${v.knew} ${v.knew === 1 ? 'person' : 'people'} knew it was ${esc(v.subjectName)}!</h2><div class="verdict gain">+${fmt(v.gain)}</div>`
        : `<div class="verdict">😅</div><h2>Nobody guessed ${esc(v.subjectName)}</h2>`;
      else if (v.correct) html = `<div class="verdict ok">✓ Correct!</div><div class="verdict gain">+${fmt(v.gain)}</div>`;
      else if (v.correct === false) html = `<div class="verdict no">✗ Nope</div><h2>It was ${v.isSubject ? 'you' : esc(v.subjectName)}</h2>`;
      else html = `<div class="verdict no">⏰ Too slow</div><h2>It was ${v.isSubject ? 'you' : esc(v.subjectName)}</h2>`;
      if (v.isSubject) html += `<p class="sub">🥹 This one was about you, from ${esc(v.authorName)}</p>`;
      $app.innerHTML = this.bar() + `<div class="screen">${html}<p class="sub">You're in ${ordinal(v.rank)} place</p></div>`;
    }
    else if (v.phase === 'final') {
      const medal = ['🥇', '🥈', '🥉'][v.rank - 1] || '🦃';
      $app.innerHTML = this.bar() + `<div class="screen"><div class="emoji">${medal}</div>
        <h2>${v.rank === 1 ? (v.tied ? 'You tied for first!' : 'You won the Friendsgiving Game!') : `You finished ${ordinal(v.rank)}`}</h2>
        <p class="sub">${fmt(v.score)} points · ${v.total} players</p></div>`;
    }
  }
};

/* ---------- start ---------- */
document.addEventListener('keydown', e => {
  if (!Host.active) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); Host.primary(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

function home() {
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  if (room) return Player.start(room);
  $app.innerHTML = `<div class="screen">
    <div class="event">Friendsgiving at James and Lindsey's</div>
    <div class="emoji">🦃 🥧 🍂</div>
    ${title()}
    <p class="sub">Everyone secretly describes a friend. Then everyone guesses who each one is about.</p>
    <div class="stack" style="max-width:360px">
      <button class="btn big" id="host">Host on this screen</button>
      <button class="btn ghost big" id="join">Join on my phone</button>
    </div>
    <p class="sub small">Open the host screen on the TV or laptop. Everyone else joins on their phone.</p>
    <details class="howto">
      <summary>How to play</summary>
      <h3>Setup</h3>
      <ol>
        <li>On a TV or laptop everyone can see, tap <b>Host on this screen</b>.</li>
        <li>Everyone else scans the QR code with their phone, or opens this site and enters the 4-letter room code.</li>
        <li>Once everyone's in, the host starts the game. Space, Enter or → also advances it.</li>
      </ol>
      <h3>Playing</h3>
      <ol>
        <li><b>Describe:</b> each phone secretly draws other players' names, each with a prompt like "Their hidden superpower". Describe them without using their name. Don't like a prompt? Swap it as many times as you want.</li>
        <li><b>Guess:</b> descriptions show up on the big screen one at a time. On your phone, pick who you think it's about. It might be you!</li>
        <li><b>Reveal:</b> the person and the writer are revealed and points are added. Highest score at the end wins.</li>
      </ol>
      <h3>Scoring</h3>
      <ul>
        <li><b>Right guess:</b> 500–1,000 points. The faster you answer, the more you get.</li>
        <li><b>Good description:</b> 150 points for each player who guesses right on yours.</li>
      </ul>
      <h3>Good to know</h3>
      <ul>
        <li><b>The host screen is the game.</b> Phones send their answers to the host's browser, and it runs everything. Keep that tab open and the screen awake. Closing or refreshing it ends the game.</li>
        <li><b>Phones don't need the same Wi-Fi.</b> Mobile data works too.</li>
        <li><b>Dropped out?</b> Rejoin with the same name to keep your score.</li>
        <li><b>Everyone gets described.</b> Names are drawn so nobody gets themselves and everyone is described the same number of times.</li>
        <li><b>Game settings</b> on the host screen let you pick how many people each player describes and seconds to guess.</li>
        <li>You need at least 3 players (not counting the host screen).</li>
      </ul>
    </details>
    <section class="prompts">
      <h3>The prompts</h3>
      <p class="sub small">Each name you draw comes with one of these at random.</p>
      <ul>${DEFAULT_PROMPTS.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </section>
  </div>
  <footer class="foot">Vibe coded by <a href="https://nikhilmath.com" target="_blank" rel="noopener">NikhilMath.com</a></footer>`;
  document.getElementById('host').onclick = () => {
    if (!window.mqtt) { setStatus("Couldn't load the game engine — check your internet."); return; }
    Host.start();
  };
  document.getElementById('join').onclick = () => Player.start('');
}

if (!window.mqtt) setStatus("Couldn't load the game engine — check your internet and refresh.");
window.__game = { Host, Player };
home();
})();
